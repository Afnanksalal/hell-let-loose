name: Design decision
description: Resolve a gameplay, presentation or architecture choice
title: "[Decision] "
labels: [needs-decision]
body:
  - type: textarea
    id: question
    attributes:
      label: Decision
      description: State the choice and link the relevant design document.
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: Options and tradeoffs
      description: Include consequences and the evidence needed to choose.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Define the decision outcome and the documents or prototype it needs.
    validations:
      required: true
