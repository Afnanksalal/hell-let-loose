name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  repository:
    name: Repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Markdown style
        uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        with:
          globs: '**/*.md'
      - name: Local documentation links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --no-progress './**/*.md'
          output: /tmp/lychee-report.md
      - name: Import and run Godot project
        shell: bash
        run: |
          godot_name=Godot_v4.7.2-stable_linux.x86_64
          curl --fail --silent --show-error --location --retry 2 \
            "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/${godot_name}.zip" \
            -o "$RUNNER_TEMP/godot.zip"
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  $RUNNER_TEMP/godot.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP"
          godot="$RUNNER_TEMP/$godot_name"
          "$godot" --headless --path . --editor --import 2>&1 | tee "$RUNNER_TEMP/godot-import.log"
          "$godot" --headless --path . --quit-after 120 -- --smoke-test 2>&1 | tee "$RUNNER_TEMP/godot-run.log"
          if grep -E '(^|[[:space:]])(SCRIPT ERROR|ERROR):' "$RUNNER_TEMP/godot-import.log" "$RUNNER_TEMP/godot-run.log"; then
            exit 1
          fi
          grep -Fx 'First room ready' "$RUNNER_TEMP/godot-run.log"
